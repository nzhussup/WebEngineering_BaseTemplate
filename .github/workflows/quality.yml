name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  quality:
    name: Lint, format, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check both workspaces
        run: npm run check
